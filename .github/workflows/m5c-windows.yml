name: M5-C Windows verification

on:
  push:
    branches: [ccr-f9c07036-vgvm5j]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: detail-page-auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: detail-page-auto/requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m playwright install chromium
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Verify clean worktree
        working-directory: .
        shell: pwsh
        run: |
          $changes = git status --porcelain=v1
          if ($changes) {
            $changes
            throw "Tests changed tracked or untracked repository files"
          }
