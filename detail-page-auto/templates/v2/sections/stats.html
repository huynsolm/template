<dl class="keyspec">{% for item in section["items"] %}{% set value = item.value %}{% set cut = value.rfind(" (") %}<div data-fact="{{ item.fact_id }}" data-index="{{ loop.index0 }}"><dt>{{ item.label }}</dt>{% if cut > 0 and value.endswith(")") %}<dd>{{ value[:cut] }}</dd><p class="note">{{ value[cut + 1:] }}</p>{% else %}<dd>{{ value }}</dd>{% endif %}</div>{% endfor %}</dl>
