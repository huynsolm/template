<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=860"><title>{{ product.name }}</title><link rel="stylesheet" href="assets/theme.css"></head>
{% if contrast_policy == "legacy" %}<body><main style="--brand: {{ product.brand_color }}">{% else %}<body style="{{ theme_variables }}"><main>{% endif %}
{% for section in sections %}<section data-section="{{ section.id }}" class="{{ section.type }}">{% include 'sections/' ~ section.type ~ '.html' %}</section>{% endfor %}
</main></body></html>
